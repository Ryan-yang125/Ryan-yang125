<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Ryan Yang — AI product developer</title>
  <desc id="desc">Ryan builds the last mile between AI capability and useful products.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#1b2731" stroke-width="1"/></pattern>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65dfc3"/><stop offset="1" stop-color="#9188ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.label{fill:#667784}.body{fill:#aab9c4}.white{fill:#edf4f7}.mint{fill:#65dfc3}.purple{fill:#9188ff}</style>
  <rect width="900" height="300" rx="18" fill="#0b1118"/>
  <rect width="900" height="300" rx="18" fill="url(#grid)" opacity=".55"/>
