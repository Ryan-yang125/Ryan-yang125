  <rect x="626" y="45" width="24" height="24" rx="7" fill="#65dfc3"/><text x="638" y="61" text-anchor="middle" fill="#0b1118" font-size="10" font-weight="700">01</text>
  <rect x="626" y="97" width="24" height="24" rx="7" fill="#18242e" stroke="#384956"/><text x="638" y="113" text-anchor="middle" class="body" font-size="10">02</text>
  <rect x="626" y="149" width="24" height="24" rx="7" fill="#18242e" stroke="#384956"/><text x="638" y="165" text-anchor="middle" class="body" font-size="10">03</text>
  <rect x="626" y="201" width="24" height="24" rx="7" fill="#18242e" stroke="#384956"/><text x="638" y="217" text-anchor="middle" class="body" font-size="10">04</text>
  <text x="670" y="61" class="white" font-size="11">CREATE</text><text x="670" y="78" class="label" font-size="8">products from capability</text>
