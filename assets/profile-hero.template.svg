  <text x="28" y="139" class="white" font-size="34" font-weight="700" letter-spacing="-1.5">AI PRODUCT</text>
  <text x="28" y="178" class="purple" font-size="34" font-weight="700" letter-spacing="-1.5">DEVELOPER.</text>
  <text x="31" y="216" class="body" font-size="13">I turn AI capability into tools people can actually use.</text>
  <text x="31" y="243" class="mint" font-size="12">BUILDING THE LAST MILE OF AI WORK →</text>

