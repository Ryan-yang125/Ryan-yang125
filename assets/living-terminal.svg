<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Ryan's living terminal</title>
  <desc id="desc">An animated terminal cycles through Ryan's open-source projects and their verified outcomes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071019" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminalClip"><rect x="12" y="12" width="876" height="386" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .muted { fill:#667784; }
    .faint { fill:#4e5d68; }
    .text { fill:#dce6ed; }
    .purple { fill:#9188ff; }
    .mint { fill:#65dfc3; }
    .amber { fill:#d9ac45; }
    .scene, .focus { opacity:0; animation-duration:20s; animation-timing-function:steps(1,end); animation-iteration-count:infinite; }
    .scene-1,.focus-1 { animation-name:phase1; }
    .scene-2,.focus-2 { animation-name:phase2; }
    .scene-3,.focus-3 { animation-name:phase3; }
    .scene-4,.focus-4 { animation-name:phase4; }
    .scene-5,.focus-5 { animation-name:phase5; }
    .caret { animation:blink 1s steps(1,end) infinite; }
    .pulse { animation:pulse 1.8s ease-in-out infinite; transform-origin:center; }
    .progress { animation:progress 20s linear infinite; }
    @keyframes phase1 { 0%,19.9%{opacity:1}20%,100%{opacity:0} }
    @keyframes phase2 { 0%,19.9%{opacity:0}20%,39.9%{opacity:1}40%,100%{opacity:0} }
    @keyframes phase3 { 0%,39.9%{opacity:0}40%,59.9%{opacity:1}60%,100%{opacity:0} }
    @keyframes phase4 { 0%,59.9%{opacity:0}60%,79.9%{opacity:1}80%,100%{opacity:0} }
    @keyframes phase5 { 0%,79.9%{opacity:0}80%,100%{opacity:1} }
    @keyframes blink { 50%{opacity:0} }
    @keyframes pulse { 0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)} }
    @keyframes progress { from{transform:translateX(-770px)}to{transform:translateX(0)} }
    @media (prefers-reduced-motion: reduce) { .scene-1,.focus-1{opacity:1}.scene:not(.scene-1),.focus:not(.focus-1){display:none}.caret,.pulse,.progress{animation:none} }
  </style>

  <rect width="900" height="410" rx="16" fill="#f6f8fa"/>
  <g filter="url(#shadow)">
    <rect x="12" y="12" width="876" height="386" rx="12" fill="#0b1118" stroke="#26323d"/>
  </g>
  <g clip-path="url(#terminalClip)">
    <rect x="12" y="12" width="876" height="40" fill="#0d141b"/>
    <line x1="12" y1="52" x2="888" y2="52" stroke="#28333e"/>
    <circle cx="30" cy="32" r="4" fill="#ff7d78"/>
    <circle cx="43" cy="32" r="4" fill="#e9b94b"/>
    <circle cx="56" cy="32" r="4" fill="#4fc77b"/>
    <text x="450" y="35" text-anchor="middle" class="muted" font-size="9">ryan@studio — public build channel</text>
    <text x="864" y="35" text-anchor="end" class="faint" font-size="8">⌘ K</text>

    <rect x="12" y="52" width="182" height="306" fill="#0f171f"/>
    <line x1="194" y1="52" x2="194" y2="358" stroke="#28333e"/>
    <text x="32" y="77" class="faint" font-size="8" letter-spacing="1.2">ACTIVE SYSTEMS</text>

    <g class="focus focus-1"><rect x="25" y="88" width="156" height="36" rx="6" fill="#19242d"/></g>
    <g class="focus focus-2"><rect x="25" y="124" width="156" height="36" rx="6" fill="#19242d"/></g>
    <g class="focus focus-3"><rect x="25" y="160" width="156" height="36" rx="6" fill="#19242d"/></g>
    <g class="focus focus-4"><rect x="25" y="196" width="156" height="36" rx="6" fill="#19242d"/></g>
    <g class="focus focus-5"><rect x="25" y="232" width="156" height="36" rx="6" fill="#19242d"/></g>

    <circle cx="39" cy="106" r="3" fill="#4b5a65"/><text x="50" y="110" class="text" font-size="10">image2studio</text><text x="169" y="110" text-anchor="end" class="mint" font-size="7">CREATE</text>
    <circle cx="39" cy="142" r="3" fill="#4b5a65"/><text x="50" y="146" class="text" font-size="10">drophere</text><text x="169" y="146" text-anchor="end" class="mint" font-size="7">LIVE</text>
    <circle cx="39" cy="178" r="3" fill="#4b5a65"/><text x="50" y="182" class="text" font-size="10">checkhere</text><text x="169" y="182" text-anchor="end" class="mint" font-size="7">PASS</text>
    <circle cx="39" cy="214" r="3" fill="#4b5a65"/><text x="50" y="218" class="text" font-size="10">skill-manager</text><text x="169" y="218" text-anchor="end" class="mint" font-size="7">CLEAN</text>
    <circle cx="39" cy="250" r="3" fill="#4b5a65"/><text x="50" y="254" class="text" font-size="10">motion-lexicon</text><text x="169" y="254" text-anchor="end" class="mint" font-size="7">OPEN</text>

    <line x1="32" y1="285" x2="174" y2="285" stroke="#28333e"/>
    <text x="32" y="302" class="faint" font-size="7" letter-spacing="1.1">ORIGIN</text>
    <text x="32" y="320" class="muted" font-size="9">ChatLLM-Web</text>
    <text x="32" y="337" class="amber" font-size="8">★ 630</text>

    <text x="220" y="78" class="faint" font-size="8" letter-spacing="1">SHANGHAI · UTC+8</text>
    <text x="862" y="78" text-anchor="end" class="faint" font-size="8" letter-spacing="1">415 CONTRIBUTIONS</text>

    <g class="scene scene-1">
      <text x="220" y="126" class="mint" font-size="14">➜</text><text x="240" y="126" class="purple" font-size="14">~/image2studio</text><text x="385" y="126" class="text" font-size="14">generate --scene poster</text><rect x="590" y="112" width="2" height="18" class="mint caret"/>
      <text x="244" y="161" class="muted" font-size="11">✓  scene variables resolved</text>
      <text x="244" y="187" class="muted" font-size="11">✓  GPT Image 2 job completed</text>
      <text x="244" y="221" class="mint" font-size="12">◆  production-ready visual saved</text>
    </g>
    <g class="scene scene-2">
      <text x="220" y="126" class="mint" font-size="14">➜</text><text x="240" y="126" class="purple" font-size="14">~/drophere</text><text x="345" y="126" class="text" font-size="14">pnpm release</text><rect x="452" y="112" width="2" height="18" class="mint caret"/>
      <text x="244" y="161" class="muted" font-size="11">✓  built CLI and Agent Skill bundle</text>
      <text x="244" y="187" class="muted" font-size="11">✓  deployed public site</text>
      <text x="244" y="221" class="mint" font-size="12">◆  v1.0.1 is live</text>
    </g>
    <g class="scene scene-3">
      <text x="220" y="126" class="mint" font-size="14">➜</text><text x="240" y="126" class="purple" font-size="14">~/checkhere</text><text x="355" y="126" class="text" font-size="14">checkhere https://site.dev</text><rect x="578" y="112" width="2" height="18" class="mint caret"/>
      <text x="244" y="161" class="muted" font-size="11">✓  Chromium checks completed</text>
      <text x="244" y="187" class="muted" font-size="11">✓  agent-readable fixes generated</text>
      <text x="244" y="221" class="mint" font-size="12">◆  release score 94</text>
    </g>
    <g class="scene scene-4">
      <text x="220" y="126" class="mint" font-size="14">➜</text><text x="240" y="126" class="purple" font-size="14">~/skills</text><text x="320" y="126" class="text" font-size="14">skill-manager audit --json</text><rect x="546" y="112" width="2" height="18" class="mint caret"/>
      <text x="244" y="161" class="muted" font-size="11">✓  global skills inspected</text>
      <text x="244" y="187" class="muted" font-size="11">✓  evidence report generated</text>
      <text x="244" y="221" class="mint" font-size="12">◆  workspace is clean</text>
    </g>
    <g class="scene scene-5">
      <text x="220" y="126" class="mint" font-size="14">➜</text><text x="240" y="126" class="purple" font-size="14">~/motion-lexicon</text><text x="400" y="126" class="text" font-size="14">pnpm build</text><rect x="495" y="112" width="2" height="18" class="mint caret"/>
      <text x="244" y="161" class="muted" font-size="11">✓  bilingual recipes compiled</text>
      <text x="244" y="187" class="muted" font-size="11">✓  machine-readable catalog ready</text>
      <text x="244" y="221" class="mint" font-size="12">◆  open vocabulary published</text>
    </g>

    <line x1="220" y1="304" x2="862" y2="304" stroke="#28333e"/>
    <text x="220" y="331" class="mint" font-size="13">➜</text><text x="240" y="331" class="purple" font-size="13">~/next</text><rect x="298" y="318" width="7" height="15" class="mint caret"/>

    <rect x="12" y="358" width="876" height="40" fill="#0d141b"/>
    <line x1="12" y1="358" x2="888" y2="358" stroke="#28333e"/>
    <text x="30" y="383" class="faint" font-size="8" letter-spacing="1">5 SYSTEMS ACTIVE</text>
    <circle cx="450" cy="379" r="3" class="mint pulse" filter="url(#glow)"/>
    <text x="463" y="383" class="muted" font-size="8" letter-spacing="1">BUILDING IN PUBLIC</text>
    <text x="865" y="383" text-anchor="end" class="faint" font-size="8" letter-spacing="1">LOOP 20s</text>
    <rect x="12" y="395" width="876" height="3" fill="#17212a"/>
    <rect class="progress" x="12" y="395" width="876" height="3" fill="#65dfc3" opacity=".65"/>
  </g>
</svg>
